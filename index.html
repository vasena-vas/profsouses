<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Профсоюзное членство — 2026</title>
<style>
  :root{
    --bg:#05070d;
    --panel:#0d1220;
    --panel2:#10162a;
    --line:#1c2439;
    --blue:#3b82f6;
    --blue2:#60a5fa;
    --blue-deep:#1d4ed8;
    --white:#f4f6fb;
    --grey:#8993ad;
    --grey-dim:#5b6480;
    --purple:#a855f7;
    --green:#22c55e;
    --yellow:#eab308;
    --orange:#f97316;
    --red:#ef4444;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(59,130,246,0.16), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(29,78,216,0.14), transparent 55%),
      var(--bg);
    color:var(--white);
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
    min-height:100%;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  ::selection{background:rgba(59,130,246,0.35);}
  .wrap{max-width:1180px;margin:0 auto;padding:38px 22px 70px;}

  header{
    display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;
    gap:16px;margin-bottom:22px;border-bottom:1px solid var(--line);padding-bottom:22px;
  }
  .header-left{display:flex;align-items:center;gap:16px;}
  .header-left img{width:64px;height:64px;border-radius:50%;flex:none;box-shadow:0 4px 16px rgba(59,130,246,.25);}
  header .eyebrow{color:var(--blue2);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin:0 0 8px;}
  header h1{
    margin:0;font-size:clamp(22px,4vw,32px);font-weight:800;letter-spacing:-0.01em;
    background:linear-gradient(90deg,var(--white),var(--blue2));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  header .updated{color:var(--grey);font-size:13px;text-align:right;}

  .deadline-banner{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
    background:linear-gradient(135deg,rgba(239,68,68,.16),rgba(249,115,22,.1));
    border:1px solid rgba(239,68,68,.35);
    border-radius:var(--radius);
    padding:14px 18px;
    margin-bottom:30px;
  }
  .deadline-banner .txt{font-size:14px;font-weight:700;color:var(--white);}
  .deadline-banner .txt b{color:#fca5a5;}
  .deadline-banner .days{
    font-size:13px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,var(--red),var(--orange));
    padding:6px 14px;border-radius:999px;white-space:nowrap;
  }

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:34px;}
  .stat{
    background:linear-gradient(160deg,var(--panel2),var(--panel));
    border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px;
    position:relative;overflow:hidden;
  }
  .stat::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--blue),transparent);}
  .stat .label{color:var(--grey);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
  .stat .value{font-size:26px;font-weight:800;color:var(--white);line-height:1.1;}
  .stat.accent .value{color:var(--blue2);}
  .stat.total{background:linear-gradient(160deg,rgba(59,130,246,0.16),var(--panel));border-color:rgba(59,130,246,0.35);}

  h2.section-title{
    display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;
    letter-spacing:.01em;margin:44px 0 16px;color:var(--white);
  }
  h2.section-title .dot{width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 12px 2px rgba(59,130,246,.7);}
  h2.section-title .count-pill{
    margin-left:auto;font-size:12px;font-weight:700;color:var(--blue2);
    background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.3);padding:4px 10px;border-radius:999px;
  }

  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .legend .item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--grey);}
  .legend .dot2{width:10px;height:10px;border-radius:3px;}

  .table-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  thead th{
    text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--grey);
    background:#080b14;padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap;
  }
  tbody td{padding:12px 16px;border-bottom:1px solid var(--line);color:var(--white);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:rgba(59,130,246,0.06);}
  tbody tr.total-row{background:linear-gradient(90deg,rgba(59,130,246,.14),rgba(59,130,246,.04));font-weight:800;}
  tbody tr.total-row td{border-bottom:none;}
  tbody tr.clickable{cursor:pointer;}
  td.num{text-align:right;font-variant-numeric:tabular-nums;}
  td.inst{font-weight:700;}

  .pct-cell{display:flex;align-items:center;gap:10px;min-width:170px;}
  .pct-bar{flex:1;height:7px;border-radius:999px;background:#161c30;overflow:hidden;border:1px solid var(--line);}
  .pct-bar > span{display:block;height:100%;border-radius:999px;}
  .pct-badge{
    min-width:56px;text-align:center;font-variant-numeric:tabular-nums;font-weight:800;
    font-size:12.5px;padding:3px 9px;border-radius:999px;color:#0a0d16;white-space:nowrap;
  }
  .pct-wrap{display:flex;flex-direction:column;gap:2px;}
  .pct-caption{font-size:10.5px;font-weight:700;color:var(--red);white-space:nowrap;}

  .c-purple{background:var(--purple);}
  .c-green{background:var(--green);}
  .c-yellow{background:var(--yellow);}
  .c-orange{background:var(--orange);color:#fff;}
  .c-red{background:var(--red);color:#fff;}
  .bar-purple{background:linear-gradient(90deg,#7e22ce,var(--purple));}
  .bar-green{background:linear-gradient(90deg,#15803d,var(--green));}
  .bar-yellow{background:linear-gradient(90deg,#a16207,var(--yellow));}
  .bar-orange{background:linear-gradient(90deg,#c2410c,var(--orange));}
  .bar-red{background:linear-gradient(90deg,#b91c1c,var(--red));}

  .toggle-row{
    display:flex;flex-wrap:wrap;gap:8px;
    background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:6px;margin-bottom:18px;
  }
  .toggle-row.wrap-scroll{border-radius:var(--radius);overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;}
  .toggle-btn{
    appearance:none;border:none;background:transparent;color:var(--grey);
    font-size:13.5px;font-weight:700;padding:9px 16px;border-radius:999px;
    cursor:pointer;white-space:nowrap;transition:all .15s ease;font-family:inherit;
  }
  .toggle-btn:hover{color:var(--white);}
  .toggle-btn.active{
    background:linear-gradient(135deg,var(--blue-deep),var(--blue));color:#fff;
    box-shadow:0 4px 14px rgba(59,130,246,.35);
  }
  .level-toggle{display:inline-flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px;margin-bottom:22px;}
  .level-toggle .toggle-btn{padding:8px 18px;font-size:13px;}

  .inst-panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;}
  .inst-panel-head{display:flex;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:18px;}
  .inst-panel-head h3{margin:0;font-size:20px;font-weight:800;}
  .inst-panel-head .level-chip{
    font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
    color:var(--blue2);background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.3);
    padding:4px 10px;border-radius:999px;
  }
  .mini-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:20px;}
  .mini-stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
  .mini-stat .l{color:var(--grey);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;}
  .mini-stat .v{font-size:19px;font-weight:800;}

  .mini-stat.pct{display:flex;flex-direction:column;gap:4px;}
  .mini-stat.pct .badge-lg{
    font-size:19px;font-weight:800;padding:3px 10px;border-radius:8px;display:inline-block;color:#0a0d16;
  }
  .mini-stat.pct .cap{font-size:11px;font-weight:700;color:var(--red);}

  .empty-note{color:var(--grey-dim);font-size:13.5px;padding:22px 4px;text-align:center;}

  footer{margin-top:50px;padding-top:18px;border-top:1px solid var(--line);color:var(--grey-dim);font-size:12px;text-align:center;}

  /* Адаптивность */
  @media (max-width: 768px){
    .wrap{padding:24px 14px 50px;}
    header{flex-direction:column;align-items:flex-start;}
    header .updated{text-align:left;font-size:12px;}
    .stats{grid-template-columns:1fr 1fr;}
    .table-card{overflow-x:auto;}
    table{min-width:600px;}
    .toggle-row.wrap-scroll{padding:6px 4px;}
    .toggle-btn{padding:8px 12px;font-size:12px;}
    .level-toggle{flex-wrap:wrap;}
    .level-toggle .toggle-btn{padding:7px 14px;font-size:12px;}
    .inst-panel{padding:16px;}
    .inst-panel-head h3{font-size:17px;}
    .mini-stats{grid-template-columns:1fr 1fr;}
    .pct-cell{min-width:140px;}
    .pct-badge{font-size:11px;padding:2px 7px;}
    .pct-caption{font-size:9.5px;}
    .deadline-banner{flex-direction:column;align-items:flex-start;}
  }
  @media (max-width: 480px){
    .stats{grid-template-columns:1fr;}
    .mini-stats{grid-template-columns:1fr;}
    .header-left img{width:48px;height:48px;}
    header .eyebrow{font-size:11px;}
    .toggle-btn{font-size:11.5px;padding:7px 10px;}
    .level-toggle .toggle-btn{font-size:11px;padding:6px 12px;}
    .pct-cell{min-width:120px;flex-direction:column;align-items:flex-start;gap:4px;}
    .pct-bar{width:100%;}
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#f2f4f9;--panel:#ffffff;--panel2:#eef2fc;--line:#dbe1f0;--white:#0c1222;--grey:#5b6480;--grey-dim:#8993ad;}
    header h1{-webkit-text-fill-color:unset;background:none;color:var(--white);}
    thead th{background:#eef1fa;}
  }
</style>
</head>
